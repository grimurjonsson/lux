<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <!-- Terminal window frame -->
  <rect width="480" height="200" rx="12" ry="12" fill="#1e1e2e"/>
  <rect width="480" height="36" rx="12" ry="12" fill="#313244"/>
  <rect y="24" width="480" height="12" fill="#313244"/>

  <!-- Traffic light dots -->
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>

  <!-- "lux" text -->
  <text x="240" y="120" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="80" font-weight="900" letter-spacing="8">
    <tspan fill="#f9e2af">l</tspan><tspan fill="#cba6f7">u</tspan><tspan fill="#89dceb">x</tspan>
  </text>

  <!-- Tagline -->
  <text x="240" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a6adc8" letter-spacing="3">
    Lit Up teXt
  </text>
</svg>
